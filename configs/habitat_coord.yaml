# LEGACY UNVALIDATED TRAINING DRAFT — not used by the Habitat smoke test.
# Use scripts/smoke_habitat.py and environment-habitat.yml; discrete data is not
# compatible with the previous continuous-action training assumptions.
defaults:
  - _self_
  - launcher: local
  - model: lewm

output_model_name: lewm_habitat_coord
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

# Habitat-specific data configuration
data:
  dataset:
    num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
    frameskip: 5
    name: habitat_coord
    keys_to_load:
      - pixels
      - action
      - coordinates
    keys_to_cache:
      - action
      - coordinates
    trajectory_dir: data/habitat_trajectories

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 1e-4
  weight_decay: 1e-3

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    weight: 0.1
    kwargs:
      knots: 17
      num_proj: 1024

# Planning configuration for coordinate goals
planning:
  horizon: 5
  cem_samples: 300
  cem_iterations: 30
  cem_elites: 30
  mpc_steps: 5
  goal_type: coordinate
