# configs/habitat_colab.yaml
# Optimized for Google Colab (T4 GPU, 12GB VRAM)
# This configuration is designed for efficient training on Colab's free tier

env:
  name: habitat
  task_type: navigation
  coord_based: true
  image_size: 64  # Reduced from 128 for memory efficiency
  max_episode_steps: 500

model:
  hidden_dim: 256  # Reduced from 512 to fit in Colab VRAM
  latent_dim: 128
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 16  # Reduced for T4 GPU (12GB VRAM)
  learning_rate: 0.0003
  epochs: 50  # Good for initial experiments
  gradient_clip: 1.0
  warmup_epochs: 5
  mixed_precision: true  # Enable AMP for ~50% memory savings
  
data:
  dataset_path: data/habitat/training_data
  train_split: 0.8
  num_workers: 2  # Don't exceed 2-4 in Colab
  prefetch_factor: 2
  pin_memory: true

logging:
  use_wandb: true
  wandb_project: "lewm-habitat-colab"
  log_interval: 100
  eval_interval: 5

checkpoint:
  save_dir: checkpoints/habitat_colab
  save_interval: 5  # Save frequently in case of session timeout
  keep_last_n: 3

hardware:
  device: cuda  # Auto-detects GPU in Colab
  seed: 42
