defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

loss:
  sigreg:
    weight: 0.09
    use_anisotropic: false  # Set to true for Manifold-Aware Regularizer (Micro-JEPA)
    kwargs:
      knots: 17
      num_proj: 1024
      # Anisotropic-specific parameters (only used when use_anisotropic=true)
      manifold_dim: 'adaptive'  # Options: 'adaptive', 'fixed_1d', 'fixed_2d', 'fixed_3d'
      min_variance: 0.01
      max_variance: 10.0
      action_history_window: 5
